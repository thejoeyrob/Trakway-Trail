<!doctype html>
<!-- Source for the home-wheel icons. Rendered to public/assets/menu/*.webp by tools/render-menu-art.cjs.
     Sticker-style: thick teal-black outline, glossy gradients, soft ground shadow. Game sprites are embedded from ./crops. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
svg.icon{display:block;width:512px;height:512px;overflow:hidden}
.o{stroke:#10343a;stroke-width:7;stroke-linejoin:round;stroke-linecap:round}

</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs>

 <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#eab53c"/><stop offset="1" stop-color="#a8700f"/></linearGradient>
 <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#c7d5db"/><stop offset="1" stop-color="#7a8e98"/></linearGradient>
 <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86f2e5"/><stop offset=".5" stop-color="#27b6b2"/><stop offset="1" stop-color="#127a7e"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa08f"/><stop offset=".5" stop-color="#e5483c"/><stop offset="1" stop-color="#a5221e"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f5c62"/><stop offset="1" stop-color="#16303a"/></linearGradient>
 <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe8ea"/></linearGradient>
 <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9be3a6"/><stop offset="1" stop-color="#4aa766"/></linearGradient>
 <radialGradient id="glowy" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffe9a0" stop-opacity=".95"/><stop offset="1" stop-color="#ffd34f" stop-opacity="0"/></radialGradient>
 <radialGradient id="floor" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#bff3ee" stop-opacity=".9"/><stop offset=".6" stop-color="#3a8f94" stop-opacity=".55"/><stop offset="1" stop-color="#16494f" stop-opacity="0"/></radialGradient>

</defs></svg>

<!-- 6. SETTINGS: spanner + screwdriver behind a cog -->
<svg class="icon" id="settings" viewBox="0 0 512 512">
 <ellipse cx="256" cy="470" rx="170" ry="24" fill="#04141a" opacity=".45"/>
 <circle cx="256" cy="250" r="230" fill="url(#glowy)" opacity=".4"/>
 <g filter="url(#shadow)">
  <!-- screwdriver -->
  <g transform="rotate(42 256 256)">
   <rect x="238" y="40" width="36" height="150" rx="14" class="o" fill="url(#gold)"/>
   <rect x="224" y="62" width="64" height="110" rx="22" class="o" fill="url(#red)"/>

   <path d="M244 428h24l-3 28h-18z" class="o" fill="url(#steel)"/>

   <path d="M196 74q4-28 28-44" stroke="#fff" stroke-width="10" fill="none" opacity=".6" stroke-linecap="round"/>
   <circle cx="256" cy="445" r="12" fill="#10343a" opacity=".85"/>
  </g>
  <!-- cog -->
  <g id="cog" transform="translate(256 256)"></g>
 </g>

<script>
 // stopwatch ticks
 const tk=document.getElementById('ticks');
 for(let i=0;i<12;i++){const a=i*Math.PI/6,r1=i%3?112:104,r2=124;const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',226+Math.sin(a)*r1);l.setAttribute('y1',268-Math.cos(a)*r1);l.setAttribute('x2',226+Math.sin(a)*r2);l.setAttribute('y2',268-Math.cos(a)*r2);tk.appendChild(l);}
 // cog with 10 teeth
 const cog=document.getElementById('cog'),N=10,R=96,r=74;let d='';
 for(let i=0;i<N;i++){const a0=i*2*Math.PI/N,w=Math.PI/N*.55;const p=(a,rad)=>[Math.sin(a)*rad,-Math.cos(a)*rad];
  const pts=[p(a0-w*1.3,r),p(a0-w*.75,R),p(a0+w*.75,R),p(a0+w*1.3,r)];d+=(i?'L':'M')+pts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L');}
 d+='Z';
 cog.innerHTML=`<path class="o" fill="url(#gold)" d="${d}"/><circle r="52" class="o" fill="url(#dark)"/><circle r="52" fill="none" stroke="#ffd34f" stroke-width="5" stroke-dasharray="3 12" opacity=".8"/><circle r="22" class="o" fill="url(#steel)"/><path d="M-70-44q20-34 56-44" stroke="#fff" stroke-width="10" fill="none" opacity=".6" stroke-linecap="round"/>`;
</script>
