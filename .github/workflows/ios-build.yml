name: iOS build check
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build bundled offline game
        run: >-
          xcodebuild -project ios/Truckin.xcodeproj -scheme Truckin
          -configuration Release -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Truckin-iOS-Simulator
          path: build/Build/Products/Release-iphonesimulator/Truckin.app
