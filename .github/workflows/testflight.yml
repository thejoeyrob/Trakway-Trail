name: Build and upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'TestFlight notes'
        default: 'Truckin & Drivin: new road hazards, night shift and garage'
        required: false
permissions:
  contents: read
concurrency:
  group: testflight-signing
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
      APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.4.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install genuine CC0 sheep bleat and validate gameplay
        run: |
          bash tools/prepare-sheep-audio.sh
          npm test
          npm run check
          node tools/sync-ios.mjs
          test -f ios/Truckin/web/play.html
          test -f ios/Truckin/web/assets/farmer.webp
      - name: Check required Apple variables
        run: |
          : "${APPSTORE_BUNDLE_ID:?Set GitHub variable APPSTORE_BUNDLE_ID}"
          : "${APPSTORE_TEAM_ID:?Set GitHub variable APPSTORE_TEAM_ID}"
          test -n '${{ vars.APPSTORE_ISSUER_ID }}'
          test -n '${{ vars.APPSTORE_API_KEY_ID }}'
      - name: Put the App Store Connect API key where Xcode can use it
        env:
          KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          : "${KEY:?Add the APPSTORE_API_PRIVATE_KEY secret (the contents of the .p8 file)}"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/keys/AuthKey_${{ vars.APPSTORE_API_KEY_ID }}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${{ vars.APPSTORE_API_KEY_ID }}.p8" >> "$GITHUB_ENV"
      # Automatic signing: with an Admin API key Xcode creates and manages the distribution certificate and App Store profile itself,
      # so no .p12 or provisioning profile has to be stored anywhere.
      - name: Archive (unsigned; it is signed for the App Store at export)
        run: |
          xcodebuild -project ios/Truckin.xcodeproj -scheme Truckin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Truckin.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ vars.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ vars.APPSTORE_ISSUER_ID }}" \
            "DEVELOPMENT_TEAM=$APPSTORE_TEAM_ID" \
            "PRODUCT_BUNDLE_IDENTIFIER=$APPSTORE_BUNDLE_ID" \
            "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Automatic CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive
      - name: Export the App Store IPA
        run: |
          python3 - <<'PY'
          import os,plistlib
          obj={'method':'app-store-connect','signingStyle':'automatic','teamID':os.environ['APPSTORE_TEAM_ID'],'uploadSymbols':True,'destination':'export','signingCertificate':'Apple Distribution'}
          with open('ios/ExportOptions.plist','wb') as f:plistlib.dump(obj,f)
          PY
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Truckin.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" -exportOptionsPlist ios/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ vars.APPSTORE_API_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ vars.APPSTORE_ISSUER_ID }}"
      - id: ipa
        name: Find exported IPA
        run: |
          IPA=$(find "$RUNNER_TEMP/TestFlight" -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
      - name: Save IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Truckin-Drivin-TestFlight-IPA
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14
      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
      - name: Upload build logs when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-failure-files
          path: |
            /Users/runner/Library/Logs/gym
            ios/ExportOptions.plist
          if-no-files-found: ignore
