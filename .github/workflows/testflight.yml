name: Build and upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'TestFlight notes'
        default: 'Truckin & Drivin: new road hazards, night shift and garage'
        required: false
permissions:
  contents: read
concurrency:
  group: testflight-signing
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
      APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '~26.4.0'
      - name: Install genuine CC0 sheep bleat and validate gameplay
        run: |
          bash tools/prepare-sheep-audio.sh
          node --test tests/game.test.mjs
          node tools/sync-ios.mjs
          test -f ios/Truckin/web/play.html
          test -f ios/Truckin/web/assets/farmer.webp
      - name: Check required Apple variables
        run: |
          : "${APPSTORE_BUNDLE_ID:?Set GitHub variable APPSTORE_BUNDLE_ID}"
          : "${APPSTORE_TEAM_ID:?Set GitHub variable APPSTORE_TEAM_ID}"
          test -n '${{ vars.APPSTORE_ISSUER_ID }}'
          test -n '${{ vars.APPSTORE_API_KEY_ID }}'
      - name: Import Apple Distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ vars.APPSTORE_BUNDLE_ID }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Generate export settings
        run: |
          python3 - <<'PY'
          import os,plistlib
          bundle=os.environ['APPSTORE_BUNDLE_ID'];team=os.environ['APPSTORE_TEAM_ID']
          obj={'method':'app-store-connect','signingStyle':'manual','teamID':team,
               'provisioningProfiles':{bundle:'AppStore '+bundle},'uploadSymbols':True}
          with open('ios/ExportOptions.plist','wb') as f:plistlib.dump(obj,f)
          PY
      - name: Archive signed iPhone app
        run: |
          xcodebuild -project ios/Truckin.xcodeproj -scheme Truckin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Truckin.xcarchive" \
            "DEVELOPMENT_TEAM=$APPSTORE_TEAM_ID" \
            "PRODUCT_BUNDLE_IDENTIFIER=$APPSTORE_BUNDLE_ID" \
            "CURRENT_PROJECT_VERSION=${GITHUB_RUN_NUMBER}" \
            CODE_SIGN_STYLE=Manual \
            "PROVISIONING_PROFILE_SPECIFIER=AppStore $APPSTORE_BUNDLE_ID" archive
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Truckin.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" -exportOptionsPlist ios/ExportOptions.plist
      - id: ipa
        name: Find exported IPA
        run: |
          IPA=$(find "$RUNNER_TEMP/TestFlight" -name '*.ipa' -print -quit)
          test -n "$IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
      - name: Save IPA build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Truckin-Drivin-TestFlight-IPA
          path: ${{ steps.ipa.outputs.path }}
          retention-days: 14
      - name: Upload to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'false'
      - name: Upload build logs when failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-failure-files
          path: |
            /Users/runner/Library/Logs/gym
            ios/ExportOptions.plist
          if-no-files-found: ignore
