name: Create the Android upload key (one-off)
# Generates the Play upload key on GitHub's runner and stores it straight into this repo's Actions secrets.
# The key and its passwords are never printed, never uploaded as an artifact and never appear in chat.
# Needs ONE temporary secret, GH_SECRETS_TOKEN: a fine-grained personal access token limited to this repo with
# "Secrets: Read and write". Delete the token and that secret afterwards.
on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Replace an existing upload key (only if you really mean it)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Refuse to overwrite an existing key
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          : "${GH_TOKEN:?Add the GH_SECRETS_TOKEN secret first (see the comment at the top of this workflow)}"
          if gh secret list --repo "$REPO" | grep -q '^ANDROID_KEYSTORE_BASE64'; then
            if [ "${{ inputs.replace_existing }}" != "true" ]; then
              echo "An upload key already exists. Re-run with replace_existing ticked only if you want a new one."; exit 1
            fi
          fi
      - name: Generate the key and save the four secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PW=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 28)
          echo "::add-mask::$PW"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.keystore" -storetype PKCS12 \
            -alias truckin -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" -dname "CN=Truckin and Drivin, O=JW EDS, C=GB" >/dev/null 2>&1
          B64=$(base64 -w0 "$RUNNER_TEMP/upload.keystore")
          echo "::add-mask::$B64"
          printf '%s' "$B64" | gh secret set ANDROID_KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$PW"  | gh secret set ANDROID_KEYSTORE_PASSWORD --repo "$REPO"
          printf '%s' "$PW"  | gh secret set ANDROID_KEY_PASSWORD --repo "$REPO"
          printf '%s' "truckin" | gh secret set ANDROID_KEY_ALIAS --repo "$REPO"
          # Print only the public certificate fingerprint, which Play Console asks for.
          keytool -list -v -keystore "$RUNNER_TEMP/upload.keystore" -storepass "$PW" 2>/dev/null | grep -E 'SHA1|SHA-256' | head -2
          rm -f "$RUNNER_TEMP/upload.keystore"
          echo "Upload key created and saved as four repository secrets."
